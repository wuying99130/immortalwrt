name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison gawk gettext git libgettextpo-dev libssl-dev libncurses5-dev libncursesw5-dev python3-pyelftools rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone source code
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd openwrt
        # 1. 彻底清除旧配置，防止隐藏残余干扰
        rm -f .config .config.old
        
        # 2. 引入自定义基础配置
        if [ -e ../r1s-h3.config ]; then
          cp -f ../r1s-h3.config .config
        fi
        
        # 3. 强行追加中文语言包
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
        
        # 4. 单次完整依赖解析
        make defconfig

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024k -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Check space usage
      run: df -h

    - name: Organize files
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_firmware
        path: ${{ env.FIRMWARE }}
