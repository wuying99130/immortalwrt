name: Build ImmortalWrt for NanoPi R1S-H3

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # 修正：去掉了不存在的虚拟包 build-upstream-tools，保留所有真正需要的编译依赖
        sudo -E apt-get -qq install $(cat << 'EOF'
        asciidoc bash bc binutils bzip2 diffcore-utils dos2unix \
        flex gawk git gnutls-bin g++ intltool jq libncurses5-dev libssl-dev \
        libz-dev lzma make mercurial patch rsync scm subversion swig texinfo \
        uglifyjs upx-ucl uuid-dev wget xmlto xxd zlib1g-dev
        EOF
        )
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source Code
      run: |
        git clone -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -e files ] && mv files openwrt/files
        # 修正：将仓库根目录的 r1s-h3.config.seed 准确复制并重命名为 openwrt 内核的 .config
        if [ -e r1s-h3.config.seed ]; then
          cp r1s-h3.config.seed openwrt/.config
        elif [ -e .config ]; then
          cp .config openwrt/.config
        fi
        cd openwrt
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files and Upload
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_ENV

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: nano-r1s-h3-base-$(date +%Y%m%d)
        files: ${{ env.FIRMWARE }}/*
        body: |
          NanoPi R1S-H3 基础底座固件
          - 包含中文界面与 Argon 主题
          - 完美支持有线网卡与板载无线网卡
