name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/gh
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update and Install Feeds
        run: |
          # 清理可能存在的旧 feeds 缓存，防止合并冲突
          rm -rf feeds.conf.default
          
          # 更新 feeds（加入防冲突容错）
          ./scripts/feeds update -a || ./scripts/feeds update -a
          
          # 安装 feeds
          ./scripts/feeds install -a

      - name: Apply Configuration & WiFi Fixes
        run: |
          cp r1s-h3.config.seed .config
          
          # 1. 严格锁定 NanoPi R1S-H3 设备名
          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1s-h3=y" >> .config
          
          # 2. 匹配并激活 R1S-H3 的 DTS 无线 WiFi 节点
          DTS_FILE=$(find target/linux/sunxi/ -iname "*nanopi*r1s*.dts" 2>/dev/null | head -n 1)
          if [ -n "$DTS_FILE" ]; then
            echo "Applying SDIO overlay to: $DTS_FILE"
            sed -i '/&mmc2/,/};/s/status = "disabled";/status = "okay";/' "$DTS_FILE"
            
            echo '' >> "$DTS_FILE"
            echo '&mmc2 {' >> "$DTS_FILE"
            echo '	pinctrl-names = "default";' >> "$DTS_FILE"
            echo '	pinctrl-0 = <&mmc2_8bit_pins>;' >> "$DTS_FILE"
            echo '	vmmc-supply = <&reg_vcc3v3>;' >> "$DTS_FILE"
            echo '	vqmmc-supply = <&reg_vcc3v3>;' >> "$DTS_FILE"
            echo '	bus-width = <4>;' >> "$DTS_FILE"
            echo '	non-removable;' >> "$DTS_FILE"
            echo '	status = "okay";' >> "$DTS_FILE"
            echo '' >> "$DTS_FILE"
            echo '	brcmf: wifi@1 {' >> "$DTS_FILE"
            echo '		reg = <1>;' >> "$DTS_FILE"
            echo '		compatible = "brcm,bcm4329-fmac";' >> "$DTS_FILE"
            echo '	};' >> "$DTS_FILE"
            echo '};' >> "$DTS_FILE"
          fi
          
          # 3. 设置默认 LAN IP 为 192.168.199.1 & 开启权威 DHCP 模式秒连
          UCI_CUSTOM="package/base-files/files/bin/config_generate"
          if [ -f "$UCI_CUSTOM" ]; then
            sed -i 's/192.168.1.1/192.168.199.1/g' "$UCI_CUSTOM"
          fi
          DHCP_CONF="package/network/services/dnsmasq/files/dhcp.conf"
          if [ -f "$DHCP_CONF" ]; then
            sed -i "/config dhcp 'lan'/a \\\toption authoritative '1'" "$DHCP_CONF"
          fi
          
          make defconfig

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p bin/out
          
          # 仅提取与 nanopi-r1s-h3 相关的固件、sha256sums 和校验文件，绝不输出其他无关板子
          find bin/targets/sunxi/cortexa7/ -type f \( -name "*nanopi-r1s-h3*" -o -name "sha256sums" \) -exec cp -f {} bin/out/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-nanopi-r1s-h3
          path: bin/out/*
