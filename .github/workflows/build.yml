name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Update Configuration and DTS
        run: |
          cp r1s-h3.config.seed .config
          
          # 1. 完整保留架构与设备目标
          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1s-h3=y" >> .config
          
          # 2. 精准补全 NanoPi R1S-H3 板载 Broadcom 无线网卡驱动及核心依赖
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "CONFIG_PACKAGE_brcmfmac-firmware-43430=y" >> .config
          echo "CONFIG_PACKAGE_kmod-cfg80211=y" >> .config
          echo "CONFIG_PACKAGE_iw=y" >> .config
          echo "CONFIG_PACKAGE_iwinfo=y" >> .config
          echo "CONFIG_PACKAGE_wpad-basic-mbedtls=y" >> .config
          
          # 3. 修复 DTS 文件中的 mmc2 (SDIO WiFi) 禁用状态为 okay
          DTS_FILE=$(find target/linux/sunxi/ -iname "*nanopi*r1s*.dts" 2>/dev/null | head -n 1)
          if [ -n "$DTS_FILE" ]; then
            sed -i '/&mmc2/,/};/s/status = "disabled";/status = "okay";/' "$DTS_FILE"
          fi
          
          make defconfig

      - name: Inject Default Wireless Configuration
        run: |
          # 4. 在根文件系统预置无线配置文件，确保固件刷入后 Wi-Fi 默认启用并加入 br-lan
          mkdir -p files/etc/config
          cat << 'EOF' > files/etc/config/wireless

          config wifi-device 'radio0'
              option type 'mac80211'
              option channel '11'
              option hwmode '11g'
              option path 'platform/soc/1c11000.mmc/mmc_host/mmc2/mmc2:0001/mmc2:0001:1'
              option htmode 'HT20'
              option disabled '0'

          config wifi-iface 'default_radio0'
              option device 'radio0'
              option network 'lan'
              option mode 'ap'
              option ssid 'NanoPi-R1S'
              option encryption 'psk2'
              option key '12345678'
              option disabled '0'
          EOF

      - name: Download Package Toolchain
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p bin/out
          
          echo "=== 正在打包 NanoPi R1S-H3 完整固件 ==="
          find bin/targets/sunxi/cortexa7/ -maxdepth 1 -type f \( -name "*.img.gz" -o -name "sha256sums" \) -exec cp -f {} bin/out/ \;
          
          echo "=== 打包输出目录清单 ==="
          ls -lh bin/out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-NanoPi-R1S-H3
          path: bin/out/*
