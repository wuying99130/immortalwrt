name: Build ImmortalWrt for NanoPi R1S-H3

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install asciidoc bash bc binutils bzip2 dos2unix flex gawk git gnutls-bin g++ intltool jq libncurses5-dev libssl-dev libz-dev lzma make mercurial patch rsync scm subversion swig texinfo uglifyjs upx-ucl uuid-dev wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source Code
      run: |
        git clone -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -e files ] && mv files openwrt/files
        if [ -e r1s-h3.config.seed ]; then
          cp r1s-h3.config.seed openwrt/.config
        elif [ -e .config ]; then
          cp .config openwrt/.config
        fi
        cd openwrt
        
        # 核心改进：强制开启单设备精简模式，禁止盲目编译全架构下其他无关板子
        echo "CONFIG_ALL=n" >> .config
        
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files and Upload
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt
        # 创建专属的干净输出目录
        mkdir -p firmware_out
        
        # 严格定位到 sunxi/cortexa7 目录，剔除 packages，把打包好的镜像和 sha256 提出来
        TARGET_DIR=$(find bin/targets/sunxi/ -type d -name "cortexa7" | head -n 1)
        if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
          rm -rf "$TARGET_DIR/packages"
          cp -f "$TARGET_DIR"/* firmware_out/ 2>/dev/null || true
        fi
        
        # 将绝对路径写进环境变量供 Release 上传
        echo "FIRMWARE=$PWD/firmware_out" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_ENV
        
        # 打印目录文件方便对账
        ls -lh firmware_out/

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: nano-r1s-h3-base-$(date +%Y%m%d)
        files: ${{ env.FIRMWARE }}/*
        body: |
          NanoPi R1S-H3 专属定制底座固件
          - 纯净单设备精简编译，无无关杂项
          - 包含中文界面与 Argon 主题
          - 完美支持有线网卡与板载无线网卡（BCM43430 SDIO）
