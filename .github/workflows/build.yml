name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'openwrt-25.12'
          fetch-depth: 0

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip wget xmlto xxd zlib1g-dev zstd
          sudo apt-get clean

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Update Configuration and DTS
        run: |
          cp r1s-h3.config.seed .config
          
          # 1. 完整保留架构与设备目标
          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1s-h3=y" >> .config
          
          # 2. 补全无线网卡驱动、底层总线、无线工具、中文语言支持及软件源/软件包管理界面
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-Hans=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmutil=y" >> .config
          echo "CONFIG_PACKAGE_kmod-cfg80211=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mmc=y" >> .config
          echo "CONFIG_PACKAGE_brcmfmac-firmware-43430-sdio=y" >> .config
          echo "CONFIG_PACKAGE_cypress-firmware-43430-sdio=y" >> .config
          echo "CONFIG_PACKAGE_iw=y" >> .config
          echo "CONFIG_PACKAGE_iwinfo=y" >> .config
          echo "CONFIG_PACKAGE_wpad-basic-mbedtls=y" >> .config
          
          # 安全植入 mDNS 广播依赖包（支持免IP主机名直连解析）
          echo "CONFIG_PACKAGE_avahi-daemon=y" >> .config
          echo "CONFIG_PACKAGE_libnss-mdns=y" >> .config
          
          # 3. 开启 Docker/容器可用的 rootfs.tar.gz 压缩包输出
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          
          # 4. 修复 DTS 文件中的 mmc2 (SDIO WiFi) 禁用状态为 okay
          DTS_FILE=$(find target/linux/sunxi/ -iname "*nanopi*r1s*.dts" 2>/dev/null | head -n 1)
          if [ -n "$DTS_FILE" ]; then
            sed -i '/&mmc2/,/};/s/status = "disabled";/status = "okay";/' "$DTS_FILE"
          fi
          
          # 5. 植入开机固定 MAC、静态 IP、DHCP 极速响应及 mDNS 主机名广播初始化脚本
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom-network-settings
          #!/bin/sh
          
          # 设置网络与固定桥接 LAN
          uci set network.lan=interface
          uci set network.lan.device='br-lan'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.1'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.stp='0'
          uci set network.lan.delegate='0'
          uci set network.lan.force_link='1'
          
          uci set network.@device[0]=device
          uci set network.@device[0].name='br-lan'
          uci set network.@device[0].type='bridge'
          uci set network.@device[0].macaddr='02:42:ac:11:00:02'
          
          # 设置内置 DHCP 服务
          uci set dhcp.lan=dhcp
          uci set dhcp.lan.interface='lan'
          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='150'
          uci set dhcp.lan.leasetime='12h'
          uci set dhcp.lan.authoritative='1'
          uci set dhcp.lan.force='1'
          
          # 安全设定默认主机名为 nanopi-r1（防止与上游命名冲突并提供 mDNS 兜底）
          uci set system.@system[0].hostname='nanopi-r1'
          
          uci commit network
          uci commit dhcp
          uci commit system
          
          # 确保开机自启 avahi-daemon 服务
          /etc/init.d/avahi-daemon enable
          /etc/init.d/avahi-daemon start || true
          EOF
          chmod +x files/etc/uci-defaults/99-custom-network-settings
          
          make defconfig

      - name: Download Package
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Organize Files
        id: organize
        if: (!cancelled())
        run: |
          cd bin/targets/*/*
          rm -rf packages profiles.json version.buildinfo sha256sums
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ${{ env.FIRMWARE }}
